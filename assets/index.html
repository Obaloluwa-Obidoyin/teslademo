<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tesla 3D Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0b0b0b; /* Sleek dark background */
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

<!-- Import Three.js and GLTFLoader via CDN (or bundle them locally) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
    let scene, camera, renderer, controls;
    let carModel, frontLeftDoor;
    let targetDoorRotation = 0.0;

    init();
    animate();

    function init() {
        // 1. Scene Setup
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);

        // 2. Camera Setup
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 6);

        // 3. Renderer Setup
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // 4. Orbit Controls (Allows dragging/pinching to rotate around the car)
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 5. Lighting (Crucial for a clean metallic car look)
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        const pointLight = new THREE.DirectionalLight(0xffffff, 1.0);
        pointLight.position.set(-5, -5, -5);
        scene.add(pointLight);

        // 6. Load your 17MB .glb Tesla Model
        const loader = new THREE.GLTFLoader();
        loader.load(
            '../tesla_model.glb', // Path relative to index.html (or setup asset routing)
            function (gltf) {
                carModel = gltf.scene;
                scene.add(carModel);

                // Find the door mesh by name (adjust name to match what's in Blender)
                frontLeftDoor = carModel.getObjectByName('Door_Front_Left');

                // Notify Flutter that the model has fully loaded
                if (window.CarBridge) {
                    window.CarBridge.postMessage("ModelLoaded");
                }
            },
            function (xhr) {
                console.log((xhr.loaded / xhr.total * 100) + '% loaded');
            },
            function (error) {
                console.error('An error happened loading the GLB:', error);
            }
        );

        // Handle window resizing smoothly
        window.addEventListener('resize', onWindowResize);
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // --- FUNCTIONS CALLED FROM FLUTTER ---

    // 1. Control Door Opening
    window.openDoorAnimation = function(isOpen) {
        targetDoorRotation = isOpen ? 0.8 : 0.0; // ~45 degrees open
    };

    // 2. Control Camera Positions across different pages
    window.setCameraView = function(viewType) {
        if (viewType === 'exterior') {
            camera.position.set(0, 2, 6);
            controls.target.set(0, 0, 0);
        } else if (viewType === 'interior') {
            camera.position.set(0, 1.1, 0.3); // Inside cabin view
            controls.target.set(0, 1.0, 0);
        } else if (viewType === 'door') {
            camera.position.set(-2.5, 1.5, 2.0); // Focused on driver door
            controls.target.set(-1, 1, 0);
        }
        controls.update();
    };

    // Render loop
    function animate() {
        requestAnimationFrame(animate);

        // Smoothly interpolate (lerp) the door rotation frame by frame
        if (frontLeftDoor) {
            frontLeftDoor.rotation.y += (targetDoorRotation - frontLeftDoor.rotation.y) * 0.1;
        }

        controls.update();
        renderer.render(scene, camera);
    }
</script>
</body>
</html>
